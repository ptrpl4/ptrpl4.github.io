<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <title>Lost in space — ptrpl4</title>
        <meta name="description" content="Page not found" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Kept in sync with the active theme by syncThemeColor(); not keyed
             on prefers-color-scheme, since the toggle is what picks the theme. -->
        <meta name="theme-color" content="#0a0e18" />
        <meta name="color-scheme" content="dark light" />
        <meta name="robots" content="noindex" />

        <link rel="icon" href="/assets/favicons/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/assets/favicons/favicon.ico" />
        <link rel="apple-touch-icon" href="/assets/favicons/apple-touch-icon.png" />
        <link rel="manifest" href="/assets/favicons/site.webmanifest" />

        <link rel="stylesheet" href="/assets/css/main.css?v=13" />

        <script>
            // Restore saved theme before paint
            (function () {
                var saved = localStorage.getItem("theme");
                if (saved === "light" || saved === "dark") {
                    document.documentElement.setAttribute("data-theme", saved);
                }

                // Browser chrome follows the toggle, not the OS. Values mirror --bg.
                var BG = { dark: "#0a0e18", light: "#7aaac8" };
                window.syncThemeColor = function (theme) {
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute("content", BG[theme] || BG.dark);
                };
                syncThemeColor(document.documentElement.getAttribute("data-theme"));

                // Delegated on document so this can live in <head>, where the
                // pre-paint work already has to happen — #theme-toggle is not
                // parsed yet. This block is identical on every page: one that
                // needs extra work on a switch sets window.onThemeChange, which
                // only the landing page does (to reroll the sky object).
                document.addEventListener("click", function (e) {
                    var t = e.target;
                    if (!t || !t.closest || !t.closest("#theme-toggle")) return;
                    var html = document.documentElement;
                    var next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
                    html.setAttribute("data-theme", next);
                    localStorage.setItem("theme", next);
                    syncThemeColor(next);
                    if (window.onThemeChange) window.onThemeChange(next);
                });
            })();
        </script>

        <style>
            #notfound {
                text-align: center;
                padding: 2em;
                animation: fadeIn 0.6s ease forwards;
            }

            #notfound h1 {
                font-size: 4em;
                font-weight: 700;
                line-height: 1;
                letter-spacing: -0.04em;
            }

            /*
             * No opacity fade here. This page is not a .text-page, so it uses
             * the global light palette (#1a3050 on #7aaac8) — 5.32:1 at full
             * strength, with no headroom to spend: 0.75 composites to 3.42:1
             * and even 0.90 only reaches 4.48:1, both under the 4.5:1 AA floor.
             * Hierarchy comes from the 4em h1 against this 0.8em instead.
             */
            #notfound p {
                margin: 0.6em 0 1.2em;
                font-size: 0.8em;
            }
        </style>
    </head>
    <body>
        <button id="theme-toggle" aria-label="Toggle theme">◐</button>

        <main id="notfound">
            <h1>404</h1>
            <p>Nothing in this orbit.</p>
            <a href="/">back to ptrpl4.page</a>
        </main>
    </body>
</html>
