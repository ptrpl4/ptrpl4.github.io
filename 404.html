<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <title>Lost in space — ptrpl4</title>
        <meta name="description" content="Page not found" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="theme-color" content="#0a0e18" media="(prefers-color-scheme: dark)" />
        <meta name="theme-color" content="#7aaac8" media="(prefers-color-scheme: light)" />
        <meta name="color-scheme" content="dark light" />
        <meta name="robots" content="noindex" />

        <link rel="icon" href="/assets/favicons/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/assets/favicons/favicon.ico" />
        <link rel="apple-touch-icon" href="/assets/favicons/apple-touch-icon.png" />
        <link rel="manifest" href="/assets/favicons/site.webmanifest" />

        <link rel="stylesheet" href="/assets/css/main.css?v=3" />

        <script>
            // Restore saved theme before paint
            (function () {
                var saved = localStorage.getItem("theme");
                if (saved === "light" || saved === "dark") {
                    document.documentElement.setAttribute("data-theme", saved);
                }
            })();
        </script>

        <style>
            #notfound {
                text-align: center;
                padding: 2em;
                animation: fadeIn 0.6s ease forwards;
            }

            #notfound h1 {
                font-size: 4em;
                font-weight: 700;
                line-height: 1;
                letter-spacing: -0.04em;
            }

            #notfound p {
                margin: 0.6em 0 1.2em;
                font-size: 0.8em;
                opacity: 0.65;
            }
        </style>
    </head>
    <body>
        <button id="theme-toggle" aria-label="Toggle theme">◐</button>

        <main id="notfound">
            <h1>404</h1>
            <p>Nothing in this orbit.</p>
            <a href="/">back to ptrpl4.page</a>
        </main>

        <script>
            document.getElementById("theme-toggle").addEventListener("click", function () {
                var html = document.documentElement;
                var next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
                html.setAttribute("data-theme", next);
                localStorage.setItem("theme", next);
            });
        </script>
    </body>
</html>
