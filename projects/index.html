<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <title>Projects — ptrpl4</title>
        <meta name="description" content="Projects by Pyotr Void" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Kept in sync with the active theme by syncThemeColor(); not keyed
             on prefers-color-scheme, since the toggle is what picks the theme.
             Dark value is this page's local --bg override, not the global one. -->
        <meta name="theme-color" content="#111c2e" />
        <meta name="color-scheme" content="dark light" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://ptrpl4.page/projects/" />
        <meta property="og:title" content="Projects — ptrpl4" />
        <meta property="og:description" content="Projects by Pyotr Void" />
        <meta property="og:image" content="https://ptrpl4.page/assets/favicons/web-app-manifest-512x512.png" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:creator" content="@ptrpl4" />

        <link rel="icon" href="../assets/favicons/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="../assets/favicons/favicon.ico" />
        <link rel="apple-touch-icon" href="../assets/favicons/apple-touch-icon.png" />
        <link rel="manifest" href="../assets/favicons/site.webmanifest" />

        <link rel="stylesheet" href="../assets/css/main.css?v=4" />

        <script>
            (function () {
                var saved = localStorage.getItem("theme");
                if (saved === "light" || saved === "dark") {
                    document.documentElement.setAttribute("data-theme", saved);
                }

                // Browser chrome follows the toggle, not the OS. Values mirror --bg.
                var BG = { dark: "#111c2e", light: "#7aaac8" };
                window.syncThemeColor = function (theme) {
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute("content", BG[theme] || BG.dark);
                };
                syncThemeColor(document.documentElement.getAttribute("data-theme"));
            })();
        </script>

        <style>
            /*
             * The global dark --bg is near-black — too dark for a text page.
             * Must not include a bare `:root`: it ties with main.css's
             * [data-theme="light"] on specificity and, being later in the
             * cascade, would win in light mode too.
             */
            [data-theme="dark"] {
                --bg: #111c2e;
                --fg: #8eaac8;
            }

            body {
                display: block;
                overflow: auto;
                min-height: 100%;
                height: auto;
                background-color: var(--bg);
            }

            #page {
                max-width: 640px;
                margin: 0 auto;
                padding: 4em 2em 4em;
                animation: fadeIn 0.5s forwards;
            }

            #page header {
                margin-bottom: 2.5em;
            }

            #page header h1 {
                font-size: 2em;
                font-weight: 700;
                letter-spacing: -0.03em;
                line-height: 1;
            }

            #page header p {
                margin-top: 0.5em;
                font-size: 0.9em;
                opacity: 0.6;
            }

            #page header a.back {
                display: inline-block;
                font-size: 0.8em;
                opacity: 0.6;
                border-bottom: none;
                margin-bottom: 1.5em;
                letter-spacing: 0;
            }

            #page header a.back:hover {
                opacity: 1;
            }

            #project-list {
                display: flex;
                flex-direction: column;
                gap: 0.1em;
            }

            .project-item {
                padding: 1em 0;
                border-bottom: solid 1px var(--border-subtle);
            }

            .project-item:last-child {
                border-bottom: none;
            }

            .project-name {
                font-size: 1em;
                font-weight: 400;
                border-bottom: dotted 1px;
                transition: border-color var(--animation-duration) ease-in-out;
            }

            .project-name:hover {
                border-color: transparent;
            }

            .project-live {
                font-size: 0.75em;
                opacity: 0.85;
                margin-left: 0.75em;
                vertical-align: middle;
                border-bottom: solid 1px var(--border-medium);
            }

            .project-live:hover {
                opacity: 1;
                border-color: transparent;
            }

            .project-desc {
                font-size: 0.8em;
                opacity: 0.65;
                margin-top: 0.25em;
                line-height: 1.4;
            }

            .project-meta {
                display: flex;
                gap: 1em;
                margin-top: 0.4em;
                font-size: 0.75em;
                opacity: 0.5;
            }

            #status {
                font-size: 0.9em;
                opacity: 0.6;
            }

            @media screen and (max-width: 736px) {
                #page {
                    padding: 2.5em 1.5em 3em;
                }

                #page header h1 {
                    font-size: 1.5em;
                }
            }
        </style>
    </head>
    <body>
        <button id="theme-toggle" aria-label="Toggle theme">◐</button>

        <div id="page">
            <header>
                <a class="back" href="/">← ptrpl4.page</a>
                <h1>Projects</h1>
                <p>Public repositories on GitHub</p>
            </header>

            <div id="project-list">
                <p id="status">Loading…</p>
            </div>

            <noscript>
                <p>
                    Enable JavaScript to load projects, or view them directly on
                    <a href="https://github.com/ptrpl4">GitHub</a>.
                </p>
            </noscript>
        </div>

        <script>
            document.getElementById("theme-toggle").addEventListener("click", function () {
                var html = document.documentElement;
                var next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
                html.setAttribute("data-theme", next);
                localStorage.setItem("theme", next);
                syncThemeColor(next);
            });
        </script>

        <script>
            (function () {
                var list = document.getElementById("project-list");
                var status = document.getElementById("status");

                function el(tag, className, text) {
                    var node = document.createElement(tag);
                    if (className) node.className = className;
                    if (text) node.textContent = text;
                    return node;
                }

                // API strings are rendered as text, never markup; hrefs are
                // restricted to http(s) so a repo `homepage` cannot smuggle in
                // a javascript: URL.
                function link(className, text, url) {
                    var a = el("a", className, text);
                    a.href = url;
                    a.target = "_blank";
                    a.rel = "noopener";
                    return a;
                }

                function safeUrl(url) {
                    if (!url) return null;
                    var s = String(url).trim();
                    if (/^https?:\/\//i.test(s)) return s;
                    // Bare host, optionally with port, then a path/query/fragment
                    // or nothing. The lookahead is what rejects `foo.bar:evil` —
                    // a scheme can only follow the TLD as `:<digits>`.
                    if (/^[\w.-]+\.[a-z]{2,}(?::\d+)?(?=[/?#]|$)/i.test(s)) return "https://" + s;
                    return null;
                }

                function fallbackNote(leading) {
                    var p = el("p", null, leading);
                    p.id = "status";
                    p.appendChild(link(null, "GitHub", "https://github.com/ptrpl4"));
                    p.appendChild(document.createTextNode("."));
                    return p;
                }

                fetch("https://api.github.com/users/ptrpl4/repos?type=public&sort=updated&per_page=100")
                    .then(function (res) {
                        if (!res.ok) throw new Error("HTTP " + res.status);
                        return res.json();
                    })
                    .then(function (repos) {
                        status.remove();

                        var cutoff = new Date();
                        cutoff.setFullYear(cutoff.getFullYear() - 2);

                        var recent = repos.filter(function (r) {
                            return !r.archived && new Date(r.pushed_at) >= cutoff;
                        });

                        if (recent.length === 0) {
                            list.appendChild(fallbackNote("Nothing active right now. Older and archived work is on "));
                            return;
                        }

                        recent.forEach(function (repo) {
                            var item = el("div", "project-item");

                            var url = safeUrl(repo.html_url);
                            item.appendChild(
                                url
                                    ? link("project-name", repo.name, url)
                                    : el("span", "project-name", repo.name)
                            );

                            var home = safeUrl(repo.homepage);
                            if (home) {
                                item.appendChild(document.createTextNode(" "));
                                item.appendChild(link("project-live", "↗ live", home));
                            }

                            if (repo.description) {
                                item.appendChild(el("p", "project-desc", repo.description));
                            }

                            var meta = [];
                            if (repo.language) meta.push(repo.language);
                            if (repo.stargazers_count > 0) meta.push("★ " + repo.stargazers_count);
                            if (repo.license && repo.license.spdx_id && repo.license.spdx_id !== "NOASSERTION") meta.push(repo.license.spdx_id);

                            if (meta.length) {
                                var metaRow = el("div", "project-meta");
                                meta.forEach(function (m) {
                                    metaRow.appendChild(el("span", null, m));
                                });
                                item.appendChild(metaRow);
                            }

                            list.appendChild(item);
                        });

                        var footer = fallbackNote("All repositories on ");
                        footer.style.marginTop = "2em";
                        list.appendChild(footer);
                    })
                    .catch(function () {
                        status.textContent = "Could not load projects. View them on ";
                        status.appendChild(link(null, "GitHub", "https://github.com/ptrpl4"));
                        status.appendChild(document.createTextNode("."));
                        // Rendering may have thrown after the node was detached
                        if (!status.isConnected) list.appendChild(status);
                    });
            })();
        </script>
    </body>
</html>
