<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <title>Projects — ptrpl4</title>
        <meta name="description" content="Projects by Pyotr Void" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <meta name="color-scheme" content="dark light" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://ptrpl4.page/projects/" />
        <meta property="og:title" content="Projects — ptrpl4" />
        <meta property="og:description" content="Projects by Pyotr Void" />
        <meta property="og:image" content="https://ptrpl4.page/assets/favicons/web-app-manifest-512x512.png" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:creator" content="@ptrpl4" />

        <link rel="icon" href="/assets/favicons/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="/assets/favicons/favicon.ico" />
        <link rel="apple-touch-icon" href="/assets/favicons/apple-touch-icon.png" />
        <link rel="manifest" href="/assets/favicons/site.webmanifest" />

        <link rel="canonical" href="https://ptrpl4.page/projects/" />

        <!-- crossorigin is required, not decorative: the list arrives via a
             credential-less CORS fetch and browsers key the socket pool on
             credential mode, so without it the warmed connection is unused. -->
        <link rel="preconnect" href="https://api.github.com" crossorigin />

        <link rel="stylesheet" href="/assets/css/main.css?v=15" />

        <script src="/assets/js/theme.js?v=15"></script>

        <style>
            /* This page declares no class on <html>, so it gets main.css's
               defaults: normal block flow and the high-contrast palette. The
               shared text-column, .page-bar, a.back and h1 rules live there
               too. Page-local rules only. */
            #page header {
                margin-bottom: 2.5em;
            }

            #project-list {
                display: flex;
                flex-direction: column;
                gap: 0.1em;
            }

            /* Divider between items, not after the last one. A trailing
               `border-bottom` + `:last-child` reset would still leave a rule
               under the final repo, since the JS appends a #status footer
               after it — so the rule goes on top of every item but the first. */
            .project-item {
                padding: 1em 0;
            }

            .project-item + .project-item {
                border-top: solid 1px var(--border-subtle);
            }

            .project-name {
                font-size: 1em;
                font-weight: 400;
                border-bottom: dotted 1px;
                transition: border-color var(--animation-duration) ease-in-out;
            }

            .project-name:hover {
                border-color: transparent;
            }

            .project-live {
                font-size: 0.75em;
                opacity: 0.85;
                margin-left: 0.75em;
                vertical-align: middle;
                border-bottom: solid 1px var(--border-medium);
            }

            .project-live:hover {
                opacity: 1;
                border-color: transparent;
            }

            /* 0.75 is the muted floor set in main.css — see the tier note
               there. Anything lower drops this text under 4.5:1. */
            .project-desc {
                font-size: 0.82em;
                opacity: 0.75;
                margin-top: 0.25em;
                line-height: 1.4;
            }

            .project-meta {
                display: flex;
                gap: 1em;
                margin-top: 0.4em;
                font-size: 0.75em;
                opacity: 0.75;
            }

            #status {
                font-size: 0.9em;
                opacity: 0.75;
            }

            .project-section {
                margin-bottom: 2.5em;
            }

            .project-section:last-of-type {
                margin-bottom: 0;
            }

            .section-title {
                font-size: 0.7em;
                font-weight: 600;
                text-transform: uppercase;
                letter-spacing: 0.1em;
                opacity: 0.75;
                margin-bottom: 0.5em;
            }

            .section-note {
                font-size: 0.8em;
                opacity: 0.75;
                margin-bottom: 0.5em;
            }

        </style>
    </head>
    <body>
        <main id="page">
            <div class="page-bar">
                <a class="back" href="/">← ptrpl4.page</a>
                <button id="theme-toggle" aria-label="Toggle theme">◐</button>
            </div>

            <header>
                <h1>Projects</h1>
            </header>

            <!-- Hand-maintained: these ship separately from their repos, which are not
                 necessarily public. When FIGa's listing goes live, add an App Store
                 .app-link and flip its .badge here and on /projects/figa/. -->
            <section class="project-section">
                <h2 class="section-title">Apps</h2>

                <div class="project-item">
                    <a class="project-name" href="/projects/clauss/">Clauss</a>
                    <span class="badge">released</span>
                    <p class="project-desc">Menu-bar manager for Claude Code sessions.</p>
                    <div class="app-platforms">macOS</div>
                    <div class="app-links">
                        <a class="app-link" href="https://apps.apple.com/app/clauss/id6781245231" target="_blank" rel="noopener">App Store ↗</a>
                        <a class="app-link" href="https://testflight.apple.com/join/cXZXyuve" target="_blank" rel="noopener">TestFlight ↗</a>
                    </div>
                </div>

                <div class="project-item">
                    <a class="project-name" href="/projects/figa/">FIGa</a>
                    <span class="badge">coming soon</span>
                    <p class="project-desc">On-device network content filter — local DNS filtering.</p>
                    <div class="app-platforms">iOS · iPadOS · macOS · tvOS</div>
                    <div class="app-links">
                        <a class="app-link" href="https://testflight.apple.com/join/xfRUWHhb" target="_blank" rel="noopener">TestFlight ↗</a>
                    </div>
                </div>
            </section>

            <section class="project-section">
                <h2 class="section-title">Open source</h2>
                <p class="section-note">Public repositories on GitHub</p>
                <div id="project-list">
                    <p id="status">Loading…</p>
                </div>
            </section>

            <noscript>
                <p>
                    Enable JavaScript to load projects, or view them directly on
                    <a href="https://github.com/ptrpl4">GitHub</a>.
                </p>
            </noscript>
        </main>

        <script>
            (function () {
                var list = document.getElementById("project-list");
                var status = document.getElementById("status");

                function el(tag, className, text) {
                    var node = document.createElement(tag);
                    if (className) node.className = className;
                    if (text) node.textContent = text;
                    return node;
                }

                // API strings are rendered as text, never markup; hrefs are
                // restricted to http(s) so a repo `homepage` cannot smuggle in
                // a javascript: URL.
                function link(className, text, url) {
                    var a = el("a", className, text);
                    a.href = url;
                    a.target = "_blank";
                    a.rel = "noopener";
                    return a;
                }

                function safeUrl(url) {
                    if (!url) return null;
                    var s = String(url).trim();
                    if (/^https?:\/\//i.test(s)) return s;
                    // Bare host, optionally with port, then a path/query/fragment
                    // or nothing. The lookahead is what rejects `foo.bar:evil` —
                    // a scheme can only follow the TLD as `:<digits>`.
                    if (/^[\w.-]+\.[a-z]{2,}(?::\d+)?(?=[/?#]|$)/i.test(s)) return "https://" + s;
                    return null;
                }

                function fallbackNote(leading) {
                    var p = el("p", null, leading);
                    p.id = "status";
                    p.appendChild(link(null, "GitHub", "https://github.com/ptrpl4"));
                    p.appendChild(document.createTextNode("."));
                    return p;
                }

                fetch("https://api.github.com/users/ptrpl4/repos?type=public&sort=updated&per_page=100")
                    .then(function (res) {
                        if (!res.ok) throw new Error("HTTP " + res.status);
                        return res.json();
                    })
                    .then(function (repos) {
                        status.remove();

                        var cutoff = new Date();
                        cutoff.setFullYear(cutoff.getFullYear() - 2);

                        var recent = repos.filter(function (r) {
                            return !r.archived && new Date(r.pushed_at) >= cutoff;
                        });

                        if (recent.length === 0) {
                            list.appendChild(fallbackNote("Nothing active right now. Older and archived work is on "));
                            return;
                        }

                        recent.forEach(function (repo) {
                            var item = el("div", "project-item");

                            var url = safeUrl(repo.html_url);
                            item.appendChild(
                                url
                                    ? link("project-name", repo.name, url)
                                    : el("span", "project-name", repo.name)
                            );

                            var home = safeUrl(repo.homepage);
                            if (home) {
                                item.appendChild(document.createTextNode(" "));
                                item.appendChild(link("project-live", "↗ live", home));
                            }

                            if (repo.description) {
                                item.appendChild(el("p", "project-desc", repo.description));
                            }

                            var meta = [];
                            if (repo.language) meta.push(repo.language);
                            if (repo.stargazers_count > 0) meta.push("★ " + repo.stargazers_count);
                            if (repo.license && repo.license.spdx_id && repo.license.spdx_id !== "NOASSERTION") meta.push(repo.license.spdx_id);

                            if (meta.length) {
                                var metaRow = el("div", "project-meta");
                                meta.forEach(function (m) {
                                    metaRow.appendChild(el("span", null, m));
                                });
                                item.appendChild(metaRow);
                            }

                            list.appendChild(item);
                        });

                        var footer = fallbackNote("All repositories on ");
                        footer.style.marginTop = "2em";
                        list.appendChild(footer);
                    })
                    .catch(function () {
                        // A throw mid-render would leave partial rows above this, and
                        // two nodes would share id="status". Clearing is safe: the list
                        // holds only the placeholder and JS-rendered rows.
                        list.textContent = "";
                        status.textContent = "Could not load projects. View them on ";
                        status.appendChild(link(null, "GitHub", "https://github.com/ptrpl4"));
                        status.appendChild(document.createTextNode("."));
                        list.appendChild(status);
                    });
            })();
        </script>
    </body>
</html>
