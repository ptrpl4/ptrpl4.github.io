<!doctype html>
<html lang="en" data-theme="dark">
    <head>
        <meta charset="utf-8" />
        <title>Clauss — ptrpl4</title>
        <meta name="description" content="Clauss — menu-bar manager for Claude Code sessions (macOS)" />
        <meta name="viewport" content="width=device-width, initial-scale=1" />
        <!-- Kept in sync with the active theme by syncThemeColor(); not keyed
             on prefers-color-scheme, since the toggle is what picks the theme.
             Dark value is the text-page --bg from main.css, not the global one. -->
        <meta name="theme-color" content="#111c2e" />
        <meta name="color-scheme" content="dark light" />

        <!-- Open Graph -->
        <meta property="og:type" content="website" />
        <meta property="og:url" content="https://ptrpl4.page/projects/clauss/" />
        <meta property="og:title" content="Clauss — ptrpl4" />
        <meta property="og:description" content="Menu-bar manager for Claude Code sessions (macOS)" />
        <meta property="og:image" content="https://ptrpl4.page/assets/favicons/web-app-manifest-512x512.png" />
        <meta name="twitter:card" content="summary" />
        <meta name="twitter:creator" content="@ptrpl4" />

        <link rel="icon" href="../../assets/favicons/favicon.svg" type="image/svg+xml" />
        <link rel="icon" href="../../assets/favicons/favicon.ico" />
        <link rel="apple-touch-icon" href="../../assets/favicons/apple-touch-icon.png" />
        <link rel="manifest" href="../../assets/favicons/site.webmanifest" />

        <link rel="canonical" href="https://ptrpl4.page/projects/clauss/" />

        <link rel="stylesheet" href="../../assets/css/main.css?v=14" />

        <script>
            (function () {
                // Storage can be refused outright — Safari with cookies blocked,
                // a locked-down profile, some file:// origins. An uncaught
                // SecurityError here would abort the rest of this block and take
                // the toggle listener below with it, leaving a dead button. Fall
                // back to a theme that lasts the session instead.
                function readTheme() {
                    try { return localStorage.getItem("theme"); } catch (e) { return null; }
                }
                function saveTheme(next) {
                    try { localStorage.setItem("theme", next); } catch (e) {}
                }

                var saved = readTheme();
                if (saved === "light" || saved === "dark") {
                    document.documentElement.setAttribute("data-theme", saved);
                }

                // Browser chrome follows the toggle, not the OS. Values mirror --bg.
                var BG = { dark: "#111c2e", light: "#8ab6d0" };
                window.syncThemeColor = function (theme) {
                    var meta = document.querySelector('meta[name="theme-color"]');
                    if (meta) meta.setAttribute("content", BG[theme] || BG.dark);
                };
                syncThemeColor(document.documentElement.getAttribute("data-theme"));

                // Delegated on document so this can live in <head>, where the
                // pre-paint work already has to happen — #theme-toggle is not
                // parsed yet. This block is identical on every page: one that
                // needs extra work on a switch sets window.onThemeChange, which
                // only the landing page does (to reroll the sky object).
                document.addEventListener("click", function (e) {
                    var t = e.target;
                    if (!t || !t.closest || !t.closest("#theme-toggle")) return;
                    var html = document.documentElement;
                    var next = html.getAttribute("data-theme") === "dark" ? "light" : "dark";
                    html.setAttribute("data-theme", next);
                    saveTheme(next);
                    syncThemeColor(next);
                    if (window.onThemeChange) window.onThemeChange(next);
                });
            })();
        </script>
    </head>
    <body class="text-page">
        <main class="app-page">
            <div class="page-bar">
                <a class="back" href="/projects/">← projects</a>
                <button id="theme-toggle" aria-label="Toggle theme">◐</button>
            </div>

            <div class="app-title">
                <h1>Clauss</h1>
                <span class="badge">released</span>
            </div>
            <p class="desc">Menu-bar manager for Claude Code sessions.</p>
            <p class="app-platforms">macOS</p>

            <!-- Store URL is deliberately storefront-less: apps.apple.com/app/<id>
                 301s each visitor to their own region. TestFlight stays alongside
                 it for pre-release builds. -->
            <div class="app-links">
                <a class="app-link" href="https://apps.apple.com/app/clauss/id6781245231" target="_blank" rel="noopener">App Store ↗</a>
                <a class="app-link" href="https://testflight.apple.com/join/cXZXyuve" target="_blank" rel="noopener">TestFlight ↗</a>
            </div>

            <!-- Terms of Use points at Apple's standard Licensed Application EULA,
                 which governs the app unless a custom EULA is supplied. -->
            <nav class="legal" aria-label="Legal">
                <a href="/projects/clauss/privacy/">Privacy Policy</a>
                <a href="https://www.apple.com/legal/internet-services/itunes/dev/stdeula/" target="_blank" rel="noopener">Terms of Use</a>
            </nav>
        </main>
    </body>
</html>
